name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller investment_tracker.spec --noconfirm

      - name: Zip release bundle
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path "dist\InvestmentTracker\*" -DestinationPath "InvestmentTracker-$version-windows.zip"

      - name: Read release notes from version.json
        id: notes
        shell: pwsh
        run: |
          $json = Get-Content version.json | ConvertFrom-Json
          $notes = $json.release_notes
          echo "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: InvestmentTracker-*.zip
          body: ${{ steps.notes.outputs.notes }}
